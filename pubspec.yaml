name: easy_khata
description: A production-ready Flutter Khata (ledger) app
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  hive_flutter: ^1.1.0
  lottie: ^3.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  share_plus: ^7.2.1
  file_picker: ^6.1.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
